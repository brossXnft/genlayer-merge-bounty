[package]
name = "glkit"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Helpers for Rust GenLayer Intelligent Contracts (genlayer_sdk v0.3-dev)"

[dependencies]
genlayer_sdk = { workspace = true }
bytes = "1"
hex = "0.4"
num-bigint = "0.4"
primitive-types = "0.13"
serde_json = { version = "1", features = ["arbitrary_precision"] }
